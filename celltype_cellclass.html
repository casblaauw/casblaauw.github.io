<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. elegans cell types</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0B0F19; --bg-surface: #1E293B; --border: #334155; --text-muted: #64748B;
    --text-secondary: #94A3B8; --text-body: #CBD5E1; --text-primary: #E2E8F0; --text-bright: #F1F5F9;
    --guide-band: #1E293B; --guide-label: #475569; --shadow: rgba(0,0,0,0.5);
    --node-default: #64748B; --link-default: #334155; --root-fill: #1E293B; --root-stroke: #475569;
    --hl: #FACC15;
  }
  body.light {
    --bg: #F8FAFC; --bg-surface: #FFFFFF; --border: #E2E8F0; --text-muted: #94A3B8;
    --text-secondary: #64748B; --text-body: #475569; --text-primary: #1E293B; --text-bright: #0F172A;
    --guide-band: #E2E8F0; --guide-label: #94A3B8; --shadow: rgba(0,0,0,0.1);
    --node-default: #94A3B8; --link-default: #CBD5E1; --root-fill: #FFFFFF; --root-stroke: #94A3B8;
    --hl: #CA8A04;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: Helvetica, Arial, sans-serif;
         overflow: hidden; height: 100vh; }
  #header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 14px 24px;
            background: linear-gradient(180deg, var(--bg) 60%, transparent);
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #header h1 { font-size: 18px; font-weight: 600; color: var(--text-bright); }
  #header .subtitle { font-size: 12px; font-weight: 300; color: var(--text-muted); }
  #nav a { font-size: 12px; color: var(--text-secondary); text-decoration: none; padding: 4px 10px;
           border: 1px solid var(--border); border-radius: 14px; margin-right: 4px; }
  #nav a.on { color: var(--text-bright); background: var(--bg-surface); }
  #controls { position: fixed; top: 54px; right: 24px; z-index: 10; display: flex; gap: 8px;
              align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ctrl-btn, #controls select, #search { background: var(--bg-surface); color: var(--text-body);
           border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; }
  .ctrl-btn { cursor: pointer; }
  #search { width: 180px; }
  #legend { position: fixed; bottom: 16px; left: 24px; right: 24px; z-index: 10; display: flex;
            gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  #tooltip { position: fixed; pointer-events: none; z-index: 100; background: var(--bg-surface);
             border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px;
             color: var(--text-body); box-shadow: 0 8px 32px var(--shadow); opacity: 0;
             transition: opacity 0.15s; max-width: 340px; }
  #tooltip .tt-name { font-weight: 600; color: var(--text-bright); margin-bottom: 4px; font-size: 13px; }
  #tooltip .tt-row { margin: 1px 0; }
  #tooltip .tt-level { color: var(--text-muted); font-size: 10px; text-transform: uppercase;
                       letter-spacing: 0.05em; margin-right: 4px; }
  #tooltip .tt-info { color: var(--text-secondary); margin-top: 6px; font-size: 11px; }
  #tooltip .tt-warn { color: var(--hl); margin-top: 6px; font-size: 11px; }
  svg { display: block; }
  .link { fill: none; stroke-width: 1.2; stroke-opacity: 0.55; }
  .link.male { stroke-dasharray: 3 3; }
  .node { cursor: pointer; }
  .node text { fill: var(--text-primary); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node text.placeholder { fill: var(--text-muted); font-style: italic; }
  .node.hl circle { stroke: var(--hl) !important; stroke-width: 3px; }
  .node.hl text { fill: var(--hl); }
  .zooming text { visibility: hidden; }
  .guide-band { fill: var(--guide-band); fill-opacity: 0.35; }
  .guide-label { font-size: 10px; fill: var(--guide-label); text-anchor: middle; }
  #ct-search { width: 220px; }
  #legend .legend-title { font-size: 11px; color: var(--text-muted); }
  #legend.many .legend-item { font-size: 10px; gap: 4px; }
  #legend.many { gap: 6px 10px; }
  #hl-info { position: fixed; top: 92px; right: 24px; z-index: 10; max-width: 440px; font-size: 12px;
             color: var(--text-body); background: var(--bg-surface); border: 1px solid var(--border);
             border-radius: 8px; padding: 8px 12px; }
  #hl-info:empty { display: none; }
  #hl-info b { color: var(--hl); }
  .node.dim circle, .node.dim text { opacity: 0.15; }
  .node.hit circle { stroke: var(--hl) !important; stroke-width: 2.5px; }
  .node.hit text { fill: var(--hl); }
  .node.lca circle { stroke: var(--hl) !important; stroke-width: 2.5px; stroke-dasharray: 2 2; }
  .link.alt { stroke-dasharray: 1 3; }
  #tooltip .tt-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
  #tooltip .tt-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  #tooltip .tt-comp { font-size: 11px; color: var(--text-secondary); }
</style>
</head>

<div id="header">

<div id="controls">

  <select id="sex">

    <option value="male">male</option>

  <button class="ctrl-btn" id="theme-btn">Light</button>
  <button class="ctrl-btn" id="expand-btn">Expand all</button>
  <button class="ctrl-btn" id="reset-btn">Reset</button>
</div>
<div id="legend"></div>
<div id="hl-info" class="lineage-only"></div>

                    fine: "fine type"};

                              fine: c.fine})[lvl];

  const seen = new Map();

  refCells.push(...seen.values());

  modeColors.cell_class = Object.fromEntries(classes.map((k, i) => [k, d3.schemeTableau10[i % 10]]));
  // broads ordered by class, sinebow hues with alternating lightness so neighbours differ
  const broads = [...new Set([...refCells].sort((a, b) => d3.ascending(a.cls + a.broad, b.cls + b.broad))
                               .map(c => c.broad))];

// tooltip
const tooltip = d3.select("#tooltip");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function showTooltip(event, d) {
  const x = d.data;
  let h = `<div class="tt-name">${esc(x.name)}${x.aka ? " / " + esc(x.aka.join(" / ")) : ""}</div>`;
  if (!LINEAGE) {
    d.ancestors().reverse().slice(1, -1).forEach(a => {
      h += `<div class="tt-row"><span class="tt-level">${esc(levelName(a.depth))}</span>${esc(a.data.name)}</div>`;
    });
  } else {
    h += `<div class="tt-row"><span class="tt-level">generation</span>${d.depth}`;
    h += `</div>`;
  }
  if (x.sex) h += `<div class="tt-row"><span class="tt-level">sex</span>${esc(x.sex)}-specific</div>`;
  if (x.info) Object.entries(x.info).forEach(([k, v]) =>
    h += `<div class="tt-row"><span class="tt-level">${esc(k)}</span>${esc(v)}</div>`);
  if (x.cells) x.cells.forEach(c =>
    h += `<div class="tt-row"><span class="tt-level">cell</span>${esc(c.cell)} · ${esc(c.cell_type || "")}` +
         `${c.fine ? " · " + esc(c.fine) : ""}` +
         (LINEAGE ? ` <span style="color:${keyColor(cellKey(c, colorMode), colorMode) || "inherit"}">` +
                    `(${esc(colorMode === "cell_type" ? c.broad : cellKey(c, colorMode))})</span>`
                  : ` <span style="color:${colorMap[c.tissue] || "inherit"}">(${esc(c.tissue)})</span>`) +
         `${c.n_lineages > 1 ? ` · 1 of ${c.n_lineages} candidate origins` : ""}${c.sex ? " · " + esc(c.sex) : ""}</div>`);
  const kids = d.data._kidsAll ? d.data._kidsAll.length : 0;
  if (LINEAGE) {
    h += compHtml(d, kids);
  } else if (x.kind !== "cell") {
    const comp = Object.entries(x.comp || {}).slice(0, 4).map(([k, v]) => `${esc(k)} ${v}`).join(", ");
    h += `<div class="tt-info">${kids ? kids + " children · " : ""}${x.n} reference cells${comp ? " — " + comp : ""}</div>`;
  }

// hierarchy (rebuilt when the sex filter changes)
let root, allNodes = [], highlighted = null;   // allNodes includes collapsed descendants
// drops nodes/cells of the other sex and recomputes counts + tissue colour of what is left;
// cell-type groups left empty are dropped, lineage nodes are kept
function filterSex(node, sex) {
  if (sex !== "all" && node.sex && node.sex !== sex) return null;
  if (node.kind === "cell") return node;
  const out = Object.assign({}, node), comp = {};
  const add = (t, k) => { comp[t] = (comp[t] || 0) + k; };
  if (node.cells) {
    out.cells = node.cells.filter(c => sex === "all" || !c.sex || c.sex === sex);
    if (!out.cells.length) delete out.cells;
    (out.cells || []).forEach(c => add(c.tissue, 1));
  }
  if (node.children) {
    out.children = node.children.map(c => filterSex(c, sex)).filter(Boolean);
    if (!out.children.length) { delete out.children; if (!LINEAGE && node.kind) return null; }
    (out.children || []).forEach(c => Object.entries(c.comp || {}).forEach(([t, k]) => add(t, k)));
  }
  out.comp = Object.fromEntries(Object.entries(comp).sort((a, b) => b[1] - a[1]));
  out.n = Object.values(comp).reduce((a, b) => a + b, 0);
  const ts = Object.keys(comp);
  out.tissue = ts.length === 1 ? ts[0] : "";
  return out;
}
function build(sex) {
  root = d3.hierarchy(filterSex(RAW, sex));
  allNodes = root.descendants();
  allNodes.forEach(d => {
    d.id = d.ancestors().map(a => a.data.name).reverse().join("/");   // unique path key
    d._allChildren = d.children;
    d.data._kidsAll = d.children;
  });
  if (LINEAGE) root.eachAfter(d => {     // unique reference cells at or below each node
    const m = new Map();
    (d.data.cells || []).forEach(c => m.set(c.cell, c));
    (d.children || []).forEach(ch => ch.data._below.forEach((c, k) => m.set(k, c)));
    d.data._below = m;
  });
  collapseToDepth(INITIAL_DEPTH);
  fillSearch();
}
function collapseToDepth(depth) {
  allNodes.forEach(d => {
    if (d.depth >= depth) { d._children = d._allChildren; d.children = null; }
    else { d.children = d._allChildren; d._children = null; }
  });
  update();
}
function expandAll() {
  allNodes.forEach(d => { d.children = d._allChildren; d._children = null; });
  update();
}
function toggle(event, d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else if (d._children) { d.children = d._children; d._children = null; }
  update();
}

// push children outward so they clear their parent's label
function adjustRadialDepths(nodes) {
  const charWidth = {1: 8.0, 2: 6.8}, defaultCW = 5.8, labelPad = 18, nodeOffset = 10;
  [...nodes].sort((a, b) => a.depth - b.depth).forEach(d => {
    if (d.depth === 0) return;
    const p = d.parent, label = labelOf(p);
    const minY = p.y + (p.depth === 0 ? 0 : label.length * (charWidth[p.depth] || defaultCW) + nodeOffset) + labelPad;
    if (d.y < minY) d.y = minY;
  });
}
const labelOf = d => d.depth === 0 ? "" : d.data.name + (d.data.aka ? " / " + d.data.aka.join(" / ") : "");

function annulusPath(r0, r1) {
  return `M0,${-r1}A${r1},${r1} 0 1,1 0,${r1}A${r1},${r1} 0 1,1 0,${-r1}Z` +
         `M0,${-r0}A${r0},${r0} 0 1,0 0,${r0}A${r0},${r0} 0 1,0 0,${-r0}Z`;
}
const fontSize = d => d.depth <= 1 ? "13px" : d.depth <= 2 ? "11px" : "9.5px";
const textX = d => d.depth === 0 ? 0 : (d.x > 0 && d.x < Math.PI ? 10 : -10);
const textAnchor = d => d.depth === 0 ? "middle" : (d.x > 0 && d.x < Math.PI ? "start" : "end");
const textRot = d => {
  if (d.depth === 0) return "";
  const a = d.x * 180 / Math.PI - 90;
  return `rotate(${d.x > 0 && d.x < Math.PI ? a : a + 180})`;
};
const circleR = d => d._lca ? 8 : d.depth === 0 ? 6 : d._children ? 5 : d.children ? 4 : 3;
const fillOpacity = d => (d._children && !d.children) ? 0.4 : (d.data.sex === "hermaphrodite" ? 0 : 1);

function update() {
  const duration = 250;
  tree(root);
  const nodes = root.descendants();
  adjustRadialDepths(nodes);
  const links = root.links();

  // guide bands per depth
  const radii = {};
  nodes.forEach(d => { if (d.depth) (radii[d.depth] = radii[d.depth] || []).push(d.y); });
  const rings = Object.entries(radii).map(([depth, ys]) => {
    ys.sort((a, b) => a - b);
    return {depth: +depth, r0: Math.max(0, ys[0] - 14), r1: ys[ys.length - 1] + 14, label: levelName(+depth)};
  });
  const bands = guideGroup.selectAll("path.guide-band").data(rings, d => d.depth);
  bands.enter().append("path").attr("class", "guide-band").merge(bands)
    .transition().duration(duration).attr("d", d => annulusPath(d.r0, d.r1));
  bands.exit().remove();
  const labs = guideGroup.selectAll("text.guide-label").data(rings, d => d.depth);
  labs.enter().append("text").attr("class", "guide-label").attr("dy", "-4").merge(labs)
    .text(d => d.label).transition().duration(duration).attr("y", d => -d.r1);
  labs.exit().remove();

  const link = linkGroup.selectAll("path.link").data(links, d => d.target.id);
  const linkEnter = link.enter().append("path")
    .attr("d", radialLink).attr("stroke", linkColor).style("opacity", 0);
  linkEnter.transition().duration(duration).style("opacity", 1);
  // highlighted cell type: path links bold (dotted when only a candidate origin), the rest faded
  linkEnter.merge(link)
    .attr("class", d => "link" + (d.target._path === 1 ? " alt" : d.target.data.sex === "male" ? " male" : ""))
    .style("stroke-width", d => d.target._path ? "2.6px" : null)
    .style("stroke-opacity", d => d.target._path ? 1 : hlSel ? 0.08 : null);
  link.transition().duration(duration).attr("d", radialLink).attr("stroke", linkColor);
  link.exit().remove();

  const node = nodeGroup.selectAll("g.node").data(nodes, d => d.id);
  const enter = node.enter().append("g").attr("class", "node")
    .attr("transform", d => `translate(${radialPoint(d.x, d.y)})`).style("opacity", 0)
    .on("click", toggle).on("mouseenter", showTooltip).on("mousemove", moveTooltip).on("mouseleave", hideTooltip);
  enter.append("circle").attr("stroke-width", 1.5);
  enter.append("text").attr("dy", "0.35em")
    .attr("class", d => d.data.placeholder ? "placeholder" : null)
    .text(labelOf).style("font-size", fontSize)
    .style("font-weight", d => d.depth <= 2 ? "bold" : "normal");
  enter.transition().duration(duration).style("opacity", 1);
  const all = enter.merge(node);
  all.classed("hl", d => d.id === highlighted)
    .classed("dim", d => !!hlSel && !d._path && d.depth > 0)
    .classed("hit", d => !!d._hit).classed("lca", d => !!d._lca);
  all.select("circle").attr("r", circleR).attr("fill-opacity", fillOpacity)
    .attr("fill", d => d.depth === 0 ? cssVar("--root-fill") : nodeColor(d))
    .attr("stroke", d => d.depth === 0 ? cssVar("--root-stroke") : nodeColor(d));
  all.select("text").attr("x", textX).attr("text-anchor", textAnchor).attr("transform", textRot);
  node.transition().duration(duration).attr("transform", d => `translate(${radialPoint(d.x, d.y)})`);
  node.exit().remove();
}
function recolorAll() { update(); }

// highlight a cell type (any level of the cell-type browser): expand the paths to every lineage node
// carrying a cell of that type, collapse everything else, mark the deepest shared ancestor
const hlInfo = d3.select("#hl-info");
const HL_LEVELS = ["cell_class", "broad", "cell_type", "fine"];
function fillCtSearch() {
  const opts = new Map();
  refCells.forEach(c => {
    const path = {cell_class: [], broad: [c.cls], cell_type: [c.cls, c.broad], fine: [c.cls, c.broad, c.cell_type]};
    HL_LEVELS.forEach(lvl => {
      const k = cellKey(c, lvl);
      if (k) opts.set(`${MODE_LABEL[lvl]}: ${k}`, {lvl, path: path[lvl].join(" › ")});
    });
  });
  d3.select("#ct-names").selectAll("option")
    .data([...opts].sort((a, b) => HL_LEVELS.indexOf(a[1].lvl) - HL_LEVELS.indexOf(b[1].lvl) || d3.ascending(a[0], b[0])))
    .join("option").attr("value", d => d[0]).attr("label", d => d[1].path);
}
function parseCtQuery(q) {
  q = q.trim();
  for (const lvl of HL_LEVELS) {
    const pre = MODE_LABEL[lvl] + ": ";
    if (q.startsWith(pre)) return {level: lvl, name: q.slice(pre.length)};
  }
  // bare name: deepest level that has it
  for (const lvl of [...HL_LEVELS].reverse())
    if (refCells.some(c => cellKey(c, lvl) === q)) return {level: lvl, name: q};
  return null;
}
function applyHighlight() {
  allNodes.forEach(d => { d._hit = false; d._path = 0; d._lca = false; });
  hlInfo.html("");
  if (!hlSel) { update(); return; }
  const match = c => cellKey(c, hlSel.level) === hlSel.name;
  const hits = allNodes.filter(d => (d.data.cells || []).some(match));
  if (!hits.length) {
    hlInfo.html(`<b>${esc(hlSel.name)}</b>: no cells in this view`);
    update(); return;
  }
  // _path 2 = on the way to a certain origin, 1 = only to candidate origins
  hits.forEach(h => {
    h._hit = true;
    const certain = h.data.cells.some(c => match(c) && c.n_lineages === 1) ? 2 : 1;
    h.ancestors().forEach(a => { a._path = Math.max(a._path, certain); });
  });
  allNodes.forEach(d => {
    if (!d._allChildren) return;
    if (d._allChildren.some(c => c._path)) { d.children = d._allChildren; d._children = null; }
    else { d._children = d._allChildren; d.children = null; }
  });
  let lca = hits[0];
  hits.slice(1).forEach(h => { const anc = new Set(h.ancestors()); while (!anc.has(lca)) lca = lca.parent; });
  lca._lca = true;
  const cells = new Map();
  hits.forEach(h => h.data.cells.filter(match).forEach(c => cells.set(c.cell, c)));
  const nAlt = [...cells.values()].filter(c => c.n_lineages > 1).length;
  hlInfo.html(`<b>${esc(hlSel.name)}</b> (${MODE_LABEL[hlSel.level]}): ${cells.size} cell${cells.size > 1 ? "s" : ""} on ${hits.length} ` +
    `lineage node${hits.length > 1 ? "s" : ""} · deepest shared ancestor <b>${esc(labelOf(lca) || lca.data.name)}</b>` +
    ` (gen ${lca.depth}, dashed ring)` +
    (nAlt ? ` · ${nAlt} cell${nAlt > 1 ? "s" : ""} with alternative origins, paths to candidate-only nodes dotted` : ""));
  update();
}
if (LINEAGE) {
  const ctInput = document.getElementById("ct-search");
  const run = () => { const s = parseCtQuery(ctInput.value); if (s) { hlSel = s; applyHighlight(); } };
  ctInput.addEventListener("change", run);
  ctInput.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  document.getElementById("ct-clear").onclick = () => {
    ctInput.value = ""; hlSel = null; applyHighlight(); collapseToDepth(INITIAL_DEPTH);
  };
  document.getElementById("color-mode").onchange = e => { colorMode = e.target.value; drawLegend(); update(); };
}

// search: matches node names, aliases and cell names; expands the path and centres the node
function fillSearch() {
  const names = new Set();
  allNodes.forEach(d => {
    names.add(d.data.name);
    (d.data.aka || []).forEach(a => names.add(a));
    (d.data.cells || []).forEach(c => names.add(c.cell));
  });
  d3.select("#names").selectAll("option").data([...names].sort()).join("option").attr("value", d => d);
}
function matches(d, q) {
  const x = d.data;
  return [x.name, ...(x.aka || []), ...(x.cells || []).map(c => c.cell)].some(s => s.toLowerCase() === q);
}
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return;
  let hits = allNodes.filter(d => matches(d, q));
  if (!hits.length) hits = allNodes.filter(d => d.data.name.toLowerCase().includes(q));
  if (!hits.length) return;
  const hit = hits[0];
  hit.ancestors().forEach(a => { if (a !== hit && a._children) { a.children = a._children; a._children = null; } });
  highlighted = hit.id;
  update();
  const [px, py] = radialPoint(hit.x, hit.y);
  const k = d3.zoomTransform(svgEl.node()).k;
  svgEl.transition().duration(500).call(zoomBehavior.transform,
    d3.zoomIdentity.translate(width / 2 - k * px, height / 2 - k * py).scale(k));
}
document.getElementById("search").addEventListener("change", e => search(e.target.value));
document.getElementById("search").addEventListener("keydown", e => { if (e.key === "Enter") search(e.target.value); });
document.getElementById("expand-btn").onclick = expandAll;
document.getElementById("reset-btn").onclick = () => {
  highlighted = null;
  if (LINEAGE) { document.getElementById("ct-search").value = ""; hlSel = null; applyHighlight(); }
  collapseToDepth(INITIAL_DEPTH);
  svgEl.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity.translate(width / 2, height / 2));
};
const sexSel = document.getElementById("sex");
sexSel.onchange = () => {
  nodeGroup.selectAll("*").remove(); linkGroup.selectAll("*").remove(); highlighted = null; build(sexSel.value);
  if (LINEAGE && hlSel) applyHighlight();
};
build("all");
if (LINEAGE) fillCtSearch();
</script>
</body>
</html>
